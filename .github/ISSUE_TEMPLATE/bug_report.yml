name: Баг
description: Что-то работает не так — падение, графика, физика, звук, интерфейс
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо. Ниже — минимум, при котором дефект можно воспроизвести без
        переписки. Если чего-то не знаете, так и напишите: честное «не проверил»
        полезнее догадки.
  - type: textarea
    id: what
    attributes:
      label: Что произошло
      description: Факт, а не вывод. «Кузов почернел после окраски в metallic=0», а не «материалы сломаны».
      placeholder: Машина на крыше после удара не предлагает рестарт, подсказка не появляется.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Машина → карта → действия. Скорость и угол, если важны.
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Откуда играли
      options:
        - готовая сборка из Releases (Windows)
        - готовая сборка из Releases (Linux)
        - из исходников (Godot, F5)
        - headless-тест (`node tools/project.mjs test`)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия игры
      description: Номер тега сборки, либо вывод `git describe --tags` из исходников.
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: ОС, видеокарта, версия движка
      description: >
        Godot 4.7.2 stable — стандартный (не .NET). GPU и драйвер важны: часть
        проверок зависит от железа.
      placeholder: |
        Windows 11 24H2, Intel UHD 730 (драйвер 31.0.101.6327), Godot 4.7.2.stable
        Размер окна: 1600×900, масштаб интерфейса: 0.7
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидалось
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Доказательства
      description: >
        Скриншот или короткий видео-гиф. Если есть — последние строки лога: в
        собранной игре это `Car Crash Simulator.log` в каталоге пользовательских
        данных (`%APPDATA%\Godot\app_userdata\Car Crash Simulator` на Windows,
        `~/.local/share/godot/app_userdata/Car Crash Simulator` на Linux); при
        прогоне из исходников — `artifacts/logs/<затом>/<тест>/*.log`.
      placeholder: "SCRIPT ERROR: ... в dent_body.gd, или кадр с чёрным кузовом"
  - type: checkboxes
    id: checks
    attributes:
      label: Что уже проверено
      options:
        - label: Искал такой баг в открытых и закрытых issues
          required: true
        - label: Проверил на чистой папке настроек (`APPDATA=<пустая папка>` на Windows) — не помогло
          required: false
        - label: Прогнал `node tools/project.mjs test` из исходников — тесты зелёные, но дефект есть
          required: false
  - type: markdown
    attributes:
      value: |
        Про безопасность — не сюда: см. [SECURITY.md](https://github.com/lightcodegit/carcrashsimulator/blob/main/SECURITY.md).
