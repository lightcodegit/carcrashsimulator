name: Smoke run the exported builds

# Exporting counts as success only when Godot says so? No: when the built game
# actually starts. A headless boot for a few frames catches an empty or corrupt
# embedded .pck, a missing main scene and initialization crashes — things the
# headless source tests cannot see, because they live in a different environment.
# The launcher is a second exported project with its own main scene, so it gets
# the same boot check.

description: 'Launch the exported binaries headless and fail if they do not boot'
inputs:
  platform:
    description: 'windows or linux'
    required: true

runs:
  using: composite
  steps:
    - name: Boot the exported builds
      shell: pwsh
      env:
        # Значения идут через env, а не интерполяцией в скрипт: вход композитного
        # действия — произвольная строка, и в pwsh-теле она не должна попадать до
        # кавычки (правило release.yml: тег из dispatch — тот же класс значения).
        PLATFORM: ${{ inputs.platform }}
      run: |
        $ErrorActionPreference = 'Stop'
        $platform = $env:PLATFORM
        $dir = Join-Path 'artifacts/build' $platform
        if (-not (Test-Path -LiteralPath $dir)) { throw "No build directory $dir." }
        # The .pck is embedded into each executable, so the directory holds two
        # binaries per platform. Names come from the export presets: "Car Crash
        # Simulator.exe" + "Car Crash Launcher.exe" on Windows, ".x86_64" on Linux.
        # The launcher carries a tiny project, so its size floor is the template
        # binary itself, not the game's embedded-content minimum.
        $expected = @(
          @{ Pattern = 'Car Crash Simulator.*'; MinBytes = 30mb },
          @{ Pattern = 'Car Crash Launcher.*'; MinBytes = 10mb }
        )
        New-Item -ItemType Directory -Force artifacts/logs | Out-Null
        foreach ($item in $expected) {
          $exe = Get-ChildItem -LiteralPath $dir -File |
            Where-Object { $_.Name -like $item.Pattern } |
            Select-Object -First 1
          if (-not $exe) { throw "No exported binary matching $($item.Pattern) under $dir — the export presets embed the .pck into the executable." }
          if ($exe.Length -lt $item.MinBytes) { throw "Suspiciously small executable $($exe.Name): $($exe.Length) bytes — the embedded .pck is missing." }
          if (-not $IsWindows) {
            chmod +x $exe.FullName
            if ($LASTEXITCODE -ne 0) { throw "Could not mark $($exe.Name) executable." }
          }
          # The launcher never auto-starts the game: PLAY waits for a click, so a
          # boot here cannot spawn a second process in CI.
          & $exe.FullName --headless --quit-after 120 2>&1 |
            Tee-Object -FilePath "artifacts/logs/smoke-$($exe.BaseName)-$platform.log"
          if ($LASTEXITCODE -ne 0) { throw "Exported build $($exe.Name) exited with $LASTEXITCODE." }
        }
