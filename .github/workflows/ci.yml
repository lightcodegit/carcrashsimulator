name: Desktop checks and builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            asset: Godot_v4.7.2-stable_linux.x86_64.zip
            executable: Godot_v4.7.2-stable_linux.x86_64
            sha256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
          - os: windows-latest
            platform: windows
            asset: Godot_v4.7.2-stable_win64.exe.zip
            executable: Godot_v4.7.2-stable_win64.exe
            sha256: 731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953
    defaults:
      run:
        shell: pwsh
    steps:
      # Действия запинены коммитом, а не тегом: тег v4 — чужая движущаяся цель, и
      # его перестановка исполняется здесь же, с правами на наш репозиторий.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'

      # Asset names and SHA-256 digests verified against the official release API:
      # https://github.com/godotengine/godot-builds/releases/tag/4.7.2-stable
      - name: Install official Godot and matching export templates
        env:
          GH_TOKEN: ${{ github.token }}
          GODOT_ASSET: ${{ matrix.asset }}
          GODOT_EXECUTABLE: ${{ matrix.executable }}
          GODOT_SHA256: ${{ matrix.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP 'godot-download'
          $editor = Join-Path $env:RUNNER_TEMP 'godot-editor'
          $unpacked = Join-Path $env:RUNNER_TEMP 'godot-templates'
          New-Item -ItemType Directory -Force $download | Out-Null
          $templateAsset = 'Godot_v4.7.2-stable_export_templates.tpz'
          gh release download 4.7.2-stable --repo godotengine/godot-builds --pattern $env:GODOT_ASSET --pattern $templateAsset --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Official Godot release download failed.' }
          $archive = Join-Path $download $env:GODOT_ASSET
          $templatesArchive = Join-Path $download $templateAsset
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:GODOT_SHA256) {
            throw 'Godot editor SHA-256 mismatch.'
          }
          if ((Get-FileHash $templatesArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011') {
            throw 'Godot templates SHA-256 mismatch.'
          }
          [System.IO.Compression.ZipFile]::ExtractToDirectory($archive, $editor)
          [System.IO.Compression.ZipFile]::ExtractToDirectory($templatesArchive, $unpacked)
          if ((Get-Content (Join-Path $unpacked 'templates/version.txt') -Raw).Trim() -ne '4.7.2.stable') {
            throw 'Export template version mismatch.'
          }
          if ($IsWindows) {
            $data = Join-Path $env:APPDATA 'Godot'
          } else {
            $data = Join-Path $HOME '.local/share/godot'
          }
          $templates = Join-Path $data 'export_templates/4.7.2.stable'
          New-Item -ItemType Directory -Force $templates | Out-Null
          Copy-Item (Join-Path $unpacked 'templates/*') $templates -Recurse -Force
          $executable = Join-Path $editor $env:GODOT_EXECUTABLE
          if (-not $IsWindows) {
            chmod +x $executable
            if ($LASTEXITCODE -ne 0) { throw 'Could not mark Godot executable.' }
          }
          "GODOT=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $executable --version
          if ($LASTEXITCODE -ne 0) { throw 'Godot version probe failed.' }

      - name: Node tooling tests
        run: |
          New-Item -ItemType Directory -Force artifacts/logs | Out-Null
          node --test tools/project.test.mjs 2>&1 | Tee-Object -FilePath artifacts/logs/node-tests.log
          exit $LASTEXITCODE
      - name: Import project headlessly
        run: node tools/project.mjs import --timeout 600
      - name: Headless suite (skips and partial coverage reported)
        run: node tools/project.mjs test --timeout 180
      - name: Export platform release
        run: node tools/project.mjs build ${{ matrix.platform }} --timeout 600
      - name: Upload logs and JSON reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: logs-${{ matrix.platform }}
          path: artifacts/logs/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload desktop build
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: car-crash-simulator-${{ matrix.platform }}
          path: artifacts/build/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14
